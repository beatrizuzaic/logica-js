<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frete | Lógica com JS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="exercicio">
    <h1>Frete por região</h1>

    <label for="compra">Valor da compra (R$)</label>
    <input type="number" id="compra" step="0.01">
    <label for="regiao">Região de entrega</label>
    <select id="regiao">
      <option value="">Selecione</option>
      <option value="sul">Sul</option>
      <option value="sudeste">Sudeste</option>
      <option value="centro-oeste">Centro-Oeste</option>
      <option value="nordeste">Nordeste</option>
      <option value="norte">Norte</option>
    </select>

    <button id="calcular">Calcular</button>
    <p id="resultado" class="resultado">O resultado aparece aqui.</p>

    <p><a href="../index.html">Voltar para a lista</a></p>
  </main>

  <script src="js/frete.js"></script>
</body>
</html>
