<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMC | Lógica com JS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="exercicio">
    <h1>Calculadora de IMC</h1>

    <label for="peso">Peso (kg)</label>
    <input type="number" id="peso" step="0.1">
    <label for="altura">Altura (m)</label>
    <input type="number" id="altura" step="0.01" placeholder="Ex.: 1.75">

    <button id="calcular">Calcular</button>
    <p id="resultado" class="resultado">O resultado aparece aqui.</p>

    <p><a href="../index.html">Voltar para a lista</a></p>
  </main>

  <script src="js/imc.js"></script>
</body>
</html>
