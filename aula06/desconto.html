<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular descontos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main>
        <h1>Calcular desconto</h1>
            <label for="preco">Preço:</label>
            <input type="number" id="preco" step="0.1">
            <label for="desconto">Desconto (%):</label>
            <input type="number" id="desconto" step="0.1">
            <button id="calcular">Calcular</button>
            <p id="resultado" class="resultado">Resultado</p>
    </main>
    <script src="./js/desconto.js"></script>
</body>
</html>
