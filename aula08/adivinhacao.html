<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhação</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="exercicio">
        <h1>Adivinhe um número</h1>
        <p>Pense em um número de 1 a 100</p>
        <label for="chute">Chute de 1 a 100</label>
        <input type="number" id="chute" min="1" max="100">

        <button id="chutar">Chutar</button>
        <p id="resultado" class="resultado">O resultado aparecerá aqui.</p>
        <p><a href="../index.html">Voltar para a lista</a></p>
    </main>
    <script src="./js/adivinhacao.js"></script>
</body>
</html>
